name: Prefect smoke

on:
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - name: Install dependencies (uv, with Prefect)
        run: |
          uv sync --group dev --extra cli --extra prefect
      - name: Run Prefect wrapper smoke tests
        run: |
          uv run pytest -q tests/unit/test_prefect_runner_smoke.py

