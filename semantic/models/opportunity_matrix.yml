models:
  - name: opportunity_matrix
    table: tvscreener.signals_batch
    primary_key: entity_id
    dimensions:
      - name: fetched_at_utc
        type: time
        granularity: second
      - name: asset_type
        type: categorical
      - name: venue
        type: categorical
      - name: scanner_family
        type: categorical
      - name: timeframe_set_id
        type: categorical
      - name: run_id
        type: categorical
      - name: params_hash
        type: categorical
      - name: entity_id
        type: categorical
      - name: pair
        type: categorical
        sql: PAIR
      - name: name
        type: categorical
        sql: Name
      - name: direction
        type: categorical
        sql: DIRECTION
      - name: grade
        type: categorical
        sql: GRADE
      - name: confluence_level
        type: categorical
        sql: CONFLUENCE_LEVEL
      - name: tf_confluence
        type: categorical
        sql: TF_CONFLUENCE
      - name: trend_dir
        type: categorical
        sql: TREND_DIR
      - name: ma_dir
        type: categorical
        sql: MA_DIR
      - name: osc_dir
        type: categorical
        sql: OSC_DIR
      - name: roc_dir
        type: categorical
        sql: ROC_DIR
      - name: subtype
        type: categorical
        sql: Subtype
    metrics:
      - name: opportunity_count
        agg: count
      - name: avg_price
        agg: avg
        sql: Price
      - name: avg_rvol
        agg: avg
        sql: RVOL
      - name: avg_ensemble_score
        agg: avg
        sql: ENSEMBLE_SCORE
      - name: avg_total_confluence
        agg: avg
        sql: TOTAL_CONFLUENCE
      - name: avg_trend_score
        agg: avg
        sql: TREND_SCORE
      - name: avg_ma_score
        agg: avg
        sql: MA_SCORE
      - name: avg_osc_score
        agg: avg
        sql: OSC_SCORE
      - name: avg_roc_score
        agg: avg
        sql: ROC_SCORE
      - name: avg_grid_aligned
        agg: avg
        sql: GRID_ALIGNED
      - name: avg_grid_total
        agg: avg
        sql: GRID_TOTAL
      - name: avg_grid_pct
        agg: avg
        sql: GRID_PCT
      - name: avg_trend_15
        agg: avg
        sql: TREND_15
      - name: avg_trend_60
        agg: avg
        sql: TREND_60
      - name: avg_trend_240
        agg: avg
        sql: TREND_240
      - name: avg_ma_15
        agg: avg
        sql: MA_15
      - name: avg_ma_60
        agg: avg
        sql: MA_60
      - name: avg_ma_240
        agg: avg
        sql: MA_240
      - name: avg_osc_15
        agg: avg
        sql: OSC_15
      - name: avg_osc_60
        agg: avg
        sql: OSC_60
      - name: avg_osc_240
        agg: avg
        sql: OSC_240
      - name: avg_roc_15
        agg: avg
        sql: ROC_15
      - name: avg_roc_60
        agg: avg
        sql: ROC_60
      - name: avg_roc_240
        agg: avg
        sql: ROC_240
      - name: count_grade_aplus
        agg: sum
        sql: "CASE WHEN GRADE = 'A+' THEN 1 ELSE 0 END"
      - name: count_direction_long
        agg: sum
        sql: "CASE WHEN DIRECTION = 'long' THEN 1 ELSE 0 END"
      - name: count_direction_short
        agg: sum
        sql: "CASE WHEN DIRECTION = 'short' THEN 1 ELSE 0 END"
      - name: count_grade_a
        agg: sum
        sql: "CASE WHEN GRADE = 'A' THEN 1 ELSE 0 END"
      - name: count_grade_b
        agg: sum
        sql: "CASE WHEN GRADE = 'B' THEN 1 ELSE 0 END"
      - name: count_grade_c
        agg: sum
        sql: "CASE WHEN GRADE = 'C' THEN 1 ELSE 0 END"
      - name: count_grade_d
        agg: sum
        sql: "CASE WHEN GRADE = 'D' THEN 1 ELSE 0 END"
