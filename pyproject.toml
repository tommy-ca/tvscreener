[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvscreener"
version = "0.2.0"
description = "TradingView Screener API"
readme = "README.md"
authors = [
    { name = "DeepEntropy" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["finance", "tradingview", "technical-analysis"]
dependencies = [
    "numpy>=2.2.6",
    "pandas>=1.3.0",
    "requests>=2.27.1",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "pyarrow>=23.0.1",
    "duckdb>=1.4.4",
    "narwhals>=1.27.0",
    "pyiceberg[sql-sqlite,pyarrow]",
    "minijinja>=2.16.0",
    "pandera>=0.29.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/deepentropy/tvscreener"
Repository = "https://github.com/deepentropy/tvscreener"
Documentation = "https://github.com/deepentropy/tvscreener"
"Bug Tracker" = "https://github.com/deepentropy/tvscreener/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]
mcp = [
    "mcp[cli]>=1.0.0",
    "tabulate>=0.9.0"
]
cli = [
    "rich>=13.0.0"
]
prefect = [
    "prefect>=3.0.0"
]

# NOTE: Sidemantic is AGPL-3.0. Keep this optional and gated.
semantic = [
    "sidemantic>=0.8.2; python_version >= '3.11'",
    "textual>=0.89.1; python_version >= '3.11'",
    "textual-plotext>=1.0.1; python_version >= '3.11'",
]

[project.scripts]
tvscreener-mcp = "tvscreener.mcp:run"
tvscreener-scan = "tvscreener.cli:main"

[tool.setuptools.packages.find]
include = ["tvscreener*"]
exclude = ["notebooks", "scripts", "tests"]

[tool.setuptools.package-data]
tvscreener = ["py.typed"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["tvscreener"]
exclude = [".dev", "docs/notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tvscreener"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/repro"]
markers = [
    "slow: long-running functional tests",
]

[tool.ty]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["tvscreener"]
exclude = [
    ".dev",
    "docs/notebooks",
    "tests",
]

[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
invalid-type-form = "ignore"
invalid-parameter-default = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-key = "ignore"
no-matching-overload = "ignore"
missing-argument = "ignore"
unresolved-import = "warn"
