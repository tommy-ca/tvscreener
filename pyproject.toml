[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvscreener"
version = "0.2.0"
description = "TradingView Screener API"
readme = "README.md"
authors = [
    { name = "DeepEntropy" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = ["finance", "tradingview", "technical-analysis"]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "requests>=2.27.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/deepentropy/tvscreener"
Repository = "https://github.com/deepentropy/tvscreener"
Documentation = "https://github.com/deepentropy/tvscreener"
"Bug Tracker" = "https://github.com/deepentropy/tvscreener/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]

[project.scripts]
# Upstream 0.2.1 doesn't ship scripts by default, but we keep this empty or remove.

[tool.setuptools.packages.find]
include = ["tvscreener*"]
exclude = ["notebooks", "scripts", "tests"]

[tool.setuptools.package-data]
tvscreener = ["py.typed"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["tvscreener"]
exclude = [".dev", "docs/notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tvscreener"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/repro"]
markers = [
    "slow: long-running functional tests",
]

[tool.ty]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["tvscreener"]
exclude = [
    ".dev",
    "docs/notebooks",
    "tests",
]

[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-method-override = "ignore"
invalid-return-type = "ignore"
invalid-type-form = "ignore"
invalid-parameter-default = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-key = "ignore"
no-matching-overload = "ignore"
missing-argument = "ignore"
unresolved-import = "warn"
