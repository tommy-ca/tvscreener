[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = ["extensions"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".dev", "docs/notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tvscreener_ext"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/repro"]
markers = [
    "slow: long-running functional tests",
]

[tool.ty.src]
include = [
    "extensions/src",
    "tests",
]
